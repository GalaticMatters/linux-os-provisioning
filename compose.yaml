  mem_limit: 4g
  shm_size: "1gb"
  restart: unless-stopped
  stop_grace_period: 20s
  cap_add:
    - NET_ADMIN
  environment:
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    TZ: ${TZ:-UTC}
  tmpfs:
    - /config:rw,nosuid,nodev,size=${DESKTOP_TMPFS_SIZE:-2g},mode=1777
  volumes:
    - ./kali/cont-init.d/99-ping:/custom-cont-init.d/99-ping:ro
    - ./lab/veth-peer.sh:/custom-cont-init.d/99-veth-peer:ro
  labels:
    fleet.reset: "true"
  extra_hosts: *lab-hosts
  logging: *json-logs
  healthcheck:
    test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/3001'"]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 180s

x-ubuntu: &ubuntu
  image: cybersecurity-ubuntu-ssh:1
  mem_limit: 4g
  build: ./ubuntu
  restart: unless-stopped
  stop_grace_period: 10s
  cap_add:
    - NET_ADMIN
  environment:
    SSH_USER: "${SSH_USER:?Set SSH_USER in .env}"
    SSH_PUBLIC_KEY: "${SSH_PUBLIC_KEY:-}"
    SSH_PASSWORD: "${SSH_PASSWORD:-}"
    TZ: ${TZ:-UTC}
  volumes:
    - ./lab/veth-peer.sh:/usr/local/bin/veth-peer.sh:ro
  labels:
    fleet.reset: "true"
  logging: *json-logs
  healthcheck:
    test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/22'"]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 20s

