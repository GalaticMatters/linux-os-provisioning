      - kali111-config:/config
      - ./kali/cont-init.d/99-ping:/custom-cont-init.d/99-ping:ro
      - ./kali/cont-init.d/99-route-host:/custom-cont-init.d/99-route-host:ro
      - ./lab/veth-peer.sh:/custom-cont-init.d/99-veth-peer:ro
    extra_hosts: *lab-hosts
    networks:
      desktop:
        gw_priority: 100
      lab111:
        interface_name: veth-peer
        gw_priority: 0
    logging: *json-logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/3000'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  ubuntu100:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    mem_limit: 4g
    shm_size: "1gb"
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      CUSTOM_USER: ${DESKTOP_USER:-van}
      PASSWORD: ${DESKTOP_PASSWORD:-}
      TITLE: Ubuntu100 desktop
    volumes:
      - /var/lib/cybersecurity/ubuntu100:/config
    extra_hosts: *lab-hosts
    networks:
      desktop:
        gw_priority: 100
      lan:
        ipv4_address: 10.0.253.52
    logging: *json-logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/3001'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  ubuntu111:
    hostname: ubuntu111
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    mem_limit: 4g
    shm_size: "1gb"
    restart: unless-stopped
    stop_grace_period: 20s
    cap_add:
      - NET_ADMIN
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      SERVER_IP: ${SERVER_IP:-10.0.253.1}
      CUSTOM_USER: ${DESKTOP_USER:-van}
      PASSWORD: ${DESKTOP_PASSWORD:-}
      TITLE: Ubuntu111 desktop
    volumes:
      - ubuntu111-config:/config
      - ./kali/cont-init.d/99-route-host:/custom-cont-init.d/99-route-host:ro
      - ./ubuntu/custom-services.d/sshd:/custom-services.d/sshd:ro
      - ./lab/veth-peer.sh:/custom-cont-init.d/99-veth-peer:ro
    extra_hosts: *lab-hosts
    networks:
      desktop:
        gw_priority: 100
      lab111:
        interface_name: veth-peer
        gw_priority: 0
        ipv4_address: 10.201.111.2
    logging: *json-logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/3000'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  derek:
    image: dockerscripts/linuxmint:cinnamon
    mem_limit: 4g
    shm_size: "1gb"
    privileged: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      TZ: ${TZ:-UTC}
      MINT_USER: ${DEREK_USER:-derek}
      MINT_PASSWORD: ${DEREK_PASSWORD:-}
    entrypoint: ["/bin/bash", "/mint-entrypoint.sh"]
    volumes:
      - derek-config:/home/${DEREK_USER:-derek}
      - ./mint/entrypoint.sh:/mint-entrypoint.sh:ro
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    extra_hosts: *lab-hosts
    networks:
      desktop:
        gw_priority: 100
      lan:
        ipv4_address: 10.0.253.53
    logging: *json-logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/3000'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s

  vyas:
    image: dockerscripts/linuxmint:cinnamon
    mem_limit: 4g
    shm_size: "1gb"
    privileged: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      TZ: ${TZ:-UTC}
      MINT_USER: ${VYAS_USER:-vyas}
      MINT_PASSWORD: ${VYAS_PASSWORD:-}
    entrypoint: ["/bin/bash", "/mint-entrypoint.sh"]
    volumes:
      - vyas-config:/home/${VYAS_USER:-vyas}
      - ./mint/entrypoint.sh:/mint-entrypoint.sh:ro
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    extra_hosts: *lab-hosts
    networks:
      desktop:
        gw_priority: 100
      lan:
        ipv4_address: 10.0.253.54
    logging: *json-logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/3000'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s

  ubuntuserver:
    image: cybersecurity-ubuntu-ssh:1
    mem_limit: 4g
    build: ./ubuntu
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      SSH_USER: ${DESKTOP_USER:-van}
      SSH_PASSWORD: ${DESKTOP_PASSWORD:-}
      TZ: ${TZ:-UTC}
    networks:
      lan:
        ipv4_address: ${UBUNTU_SERVER_IP:-10.0.253.41}
    logging: *json-logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/22'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2.11.7-alpine
    mem_limit: 4g
    restart: unless-stopped
    depends_on:
      - kali01
      - kali02
      - kali03
      - kali04
      - kali05
      - kali06
      - kali07
      - kali08
      - kali09
      - kali10
      - kali11
      - kali12
      - kali13
      - kali14
      - kali15
      - kali16
      - kali17
      - kali18
      - kali19
      - kali20
      - kali21
      - kali22
      - kali23
      - kali24
      - kali25
      - kali26
      - kali27
      - kali28
      - kali29
      - kali30
      - kali111
      - ubuntu100
      - ubuntu111
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-cybersecurity.lan}
      TZ: ${TZ:-UTC}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/site:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [desktop]
    logging: *json-logs
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1/ 2>&1 | grep -q 308"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dnsmasq:
    profiles: ["dns"]
    build: ./dns
    image: cybersecurity-dnsmasq:1
    mem_limit: 4g
    restart: unless-stopped
    environment:
      SERVER_IP: ${SERVER_IP:?Set SERVER_IP in .env to this server's LAN address}
      BASE_DOMAIN: ${BASE_DOMAIN:-cybersecurity.lan}
      UPSTREAM_DNS_1: ${UPSTREAM_DNS_1:-1.1.1.1}
      UPSTREAM_DNS_2: ${UPSTREAM_DNS_2:-1.0.0.1}
    ports:
      - "${SERVER_IP}:${DNS_PORT:-53}:53/udp"
      - "${SERVER_IP}:${DNS_PORT:-53}:53/tcp"
    volumes:
      - ./dns/records.conf:/records.conf:ro
    networks: [desktop]
    logging: *json-logs
    healthcheck:
      test: ["CMD-SHELL", "dig +short +time=2 +tries=1 kali01.$${BASE_DOMAIN} @127.0.0.1 | grep -qx \"$$SERVER_IP\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  scheduler:
    build: ./scheduler
    image: cybersecurity-scheduler:1
    mem_limit: 4g
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:ro
    networks: [desktop]
    logging: *json-logs

  cloudflared:
    profiles: ["public"]
    image: cloudflare/cloudflared:latest
    mem_limit: 4g
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [desktop]
    logging: *json-logs

