      - kali25
      - kali26
      - kali27
      - kali28
      - kali29
      - kali30
      - kali111
      - derek
      - sang
      - ashraful
      - ubuntu100
      - ubuntu111
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-cybersecurity.lan}
      TZ: ${TZ:-UTC}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/site:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [desktop]
    logging: *json-logs
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1/ 2>&1 | grep -q 308"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dnsmasq:
    profiles: ["dns"]
    build: ./dns
    image: cybersecurity-dnsmasq:1
    mem_limit: 4g
    restart: unless-stopped
    environment:
      SERVER_IP: ${SERVER_IP:?Set SERVER_IP in .env to this server's LAN address}
      BASE_DOMAIN: ${BASE_DOMAIN:-cybersecurity.lan}
      UPSTREAM_DNS_1: ${UPSTREAM_DNS_1:-1.1.1.1}
      UPSTREAM_DNS_2: ${UPSTREAM_DNS_2:-1.0.0.1}
    ports:
      - "${SERVER_IP}:${DNS_PORT:-53}:53/udp"
      - "${SERVER_IP}:${DNS_PORT:-53}:53/tcp"
    volumes:
      - ./dns/records.conf:/records.conf:ro
    networks: [desktop]
    logging: *json-logs
    healthcheck:
      test: ["CMD-SHELL", "dig +short +time=2 +tries=1 kali01.$${BASE_DOMAIN} @127.0.0.1 | grep -qx \"$$SERVER_IP\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  scheduler:
    build: ./scheduler
    image: cybersecurity-scheduler:1
    mem_limit: 4g
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:ro
    networks: [desktop]
    logging: *json-logs

  cloudflared:
    profiles: ["public"]
    image: cloudflare/cloudflared:latest
    mem_limit: 4g
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [desktop]
    logging: *json-logs

networks:
  desktop:
    name: cybersecurity-desktop
  lan:
    name: cybersecurity-macvlan
    driver: macvlan
    driver_opts:
      parent: ${PARENT_IFACE:?Set PARENT_IFACE to the interface that already has 10.0.253.1}
    ipam:
      config:
        - subnet: ${LAN_SUBNET:?Set LAN_SUBNET}
          gateway: ${LAN_GATEWAY:?Set LAN_GATEWAY}

  veth01:
