# Generated by scripts/render.py. Do not edit by hand.
# Kali desktops: 30. Ubuntu SSH servers: 30.
# Re-run the script after changing counts, UBUNTU_IP_START, or BASE_DOMAIN.
# PARENT_IFACE, LAN_SUBNET, and LAN_GATEWAY are still read from .env when Compose starts.

name: cybersecurity-lan

x-logging: &json-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-kali: &kali
  image: lscr.io/linuxserver/kali-linux:latest
  shm_size: "1gb"
  restart: unless-stopped
  stop_grace_period: 20s
  environment:
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    TZ: ${TZ:-UTC}
  tmpfs:
    - /config:rw,nosuid,nodev,size=${DESKTOP_TMPFS_SIZE:-2g},mode=1777
  labels:
    fleet.reset: "true"
  logging: *json-logs
  healthcheck:
    test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/3001'"]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 180s

x-ubuntu: &ubuntu
  image: cybersecurity-ubuntu-ssh:1
  build: ./ubuntu
  restart: unless-stopped
  stop_grace_period: 10s
  environment:
    SSH_USER: "${SSH_USER:?Set SSH_USER in .env}"
    SSH_PUBLIC_KEY: "${SSH_PUBLIC_KEY:-}"
    SSH_PASSWORD: "${SSH_PASSWORD:-}"
    TZ: ${TZ:-UTC}
  labels:
    fleet.reset: "true"
  logging: *json-logs
  healthcheck:
    test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/22'"]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 20s

