# Drop-in for a dnsmasq that is already running on the network.
# Replace SERVER_IP with the Linux server's LAN address, copy this file to
# /etc/dnsmasq.d/desktop.lan.conf, and restart that dnsmasq.
# Do not also publish this stack's dnsmasq on port 53.
#
# address=/desktop.lan/<ip> answers desktop.lan and every subdomain.
address=/desktop.lan/SERVER_IP
local=/desktop.lan/
